name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here needs to write to the repository. Actions are pinned to full
# commit SHAs rather than mutable tags so CI cannot change without a diff.
permissions:
  contents: read

env:
  MLFLOW_VERSION: "3.15.2"
  MLFLOW_MIDSTREAM_REF: "master"
  # Pinned protoc. The compiler version is stamped into the header of every
  # generated *.pb.go (36.2 is emitted as "protoc v7.36.2"), so an unpinned
  # protoc would make `make gen` output differ between CI and developer
  # machines. Bumping this requires re-running `make gen` and committing the
  # regenerated code in the same change.
  PROTOC_VERSION: "36.2"
  PROTOC_SHA256: "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run linting
        run: make lint

      - name: Run vet
        run: make vet

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)" || (echo "Code is not formatted. Run 'make fmt'" && exit 1)

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy. Run 'go mod tidy'" && exit 1)

  gen:
    name: generated protobuf code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install protoc
        run: |
          set -euo pipefail
          zip="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -sSfL -o "${zip}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${zip}"
          echo "${PROTOC_SHA256}  ${zip}" | sha256sum -c -
          sudo unzip -q -o "${zip}" -d /usr/local
          rm -f "${zip}"
          protoc --version

      # Note: this reaches the network. tools/proto/fetch-protos.sh curls the
      # pinned MLflow protos from raw.githubusercontent.com.
      - name: Regenerate protobuf code
        run: make gen

      - name: Verify committed output matches the generator
        run: |
          if ! git diff --exit-code; then
            echo "::error::Committed generated code does not match 'make gen' output. Run 'make gen' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "${untracked}" ]; then
            echo "::error::'make gen' produced new untracked files. Commit them."
            echo "${untracked}"
            exit 1
          fi

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run unit tests
        run: make test/unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run integration tests
        run: make test/integration-ci

  test-integration-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run PostgreSQL integration tests
        run: make test/integration-ci-postgres

  test-integration-midstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run midstream integration tests
        run: make test/integration-ci-midstream MLFLOW_MIDSTREAM_REF=${{ env.MLFLOW_MIDSTREAM_REF }}
