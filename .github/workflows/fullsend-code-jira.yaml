name: Fullsend RHAI epic execution
run-name: RHAI poll ${{ inputs.poll_run_id }} record ${{ inputs.record_index }}

on:
  workflow_dispatch:
    inputs:
      poll_run_id:
        description: Trusted main-branch poll run ID
        required: true
        type: string
      poll_attempt:
        description: Poll run attempt
        required: true
        type: string
      record_index:
        description: Zero-based index in the poll artifact
        required: true
        type: string

permissions: {}

# Runs one dispatch record from fullsend-poll-jira.yaml. Part of the per-record
# fan-out that works around https://github.com/fullsend-ai/fullsend/issues/8961;
# remove this workflow once that is fixed.

jobs:
  validate:
    if: github.repository == 'opendatahub-io/mlflow-go' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.record.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Inputs identify an artifact, never an event payload or executable ref.
      # Require the exact polling revision, including if main moved meanwhile.
      - name: Validate poll provenance and revision
        env:
          GH_TOKEN: ${{ github.token }}
          POLL_RUN_ID: ${{ inputs.poll_run_id }}
          POLL_ATTEMPT: ${{ inputs.poll_attempt }}
        run: python3 .fullsend/scripts/jira_dispatch.py validate

      - uses: actions/download-artifact@v4
        with:
          name: jira-dispatches-${{ inputs.poll_attempt }}
          run-id: ${{ inputs.poll_run_id }}
          github-token: ${{ github.token }}

      - name: Select one trusted dispatch record
        id: record
        env:
          RECORD_INDEX: ${{ inputs.record_index }}
        run: python3 .fullsend/scripts/jira_dispatch.py select

  code:
    needs: validate
    if: needs.validate.outputs.matrix != ''
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    # TODO: replace v0.54.0 with its release commit SHA once it is out.
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@v0.54.0
    with:
      matrix: ${{ needs.validate.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: https://redhat.atlassian.net
      runner_image: ubuntu-24.04
    secrets:
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      FULLSEND_OPENAI_API_KEY: ${{ secrets.FULLSEND_OPENAI_API_KEY }}
      FULLSEND_INFERENCE_GATEWAY_API_KEY: ${{ secrets.FULLSEND_INFERENCE_GATEWAY_API_KEY }}
      FULLSEND_GITHUB_RUNNER_SECRETS: ${{ secrets.FULLSEND_GITHUB_RUNNER_SECRETS }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
