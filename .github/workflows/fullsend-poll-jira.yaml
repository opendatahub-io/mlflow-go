name: Fullsend RHAI epic coding

# Polls RHAI epics aimed at this repository and starts the code agent.
# Instead of passing every dispatch record to reusable-dispatch.yml as one
# matrix, this launches one execution run per record (fullsend-code-jira.yaml).
# Workaround for https://github.com/fullsend-ai/fullsend/issues/8961: records
# for the same agent in one matrix collide on the fullsend-<agent> artifact.
# Remove the fan-out once that is fixed.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions: {}

# Serialize discovery and dispatch, including manual runs.
concurrency:
  group: fullsend-rhai-epic-coding
  cancel-in-progress: false

jobs:
  poll:
    if: github.repository == 'opendatahub-io/mlflow-go' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Fullsend
        # TODO: replace v0.54.0 with its release commit SHA once it is out.
        # It is the first expected release with fullsend#8892, which lets the
        # poller run without the Administer Projects permission.
        uses: fullsend-ai/fullsend/.github/actions/install-fullsend-cli@v0.54.0
        with:
          mode: upstream
          workflow_repository: fullsend-ai/fullsend
          workflow_sha: v0.54.0

      - name: Poll ready RHAI epics
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: https://redhat.atlassian.net
          # Epics generated by Epic Creator for AI implementation, marked
          # ready, and aimed at this repository. Environment is free text, so
          # `~` is a phrase match, not equality. These selectors are
          # provisional until the epic tooling settles on its markers.
          JQL: >-
            project = RHAI
            AND issuetype = Epic
            AND labels = "epic-creator-auto-created"
            AND labels in ("epic-creator-ai-impl-high", "epic-creator-ai-impl-medium")
            AND labels = "ready-to-code"
            AND environment ~ "\"https://github.com/opendatahub-io/mlflow-go\""
            AND statusCategory != Done
            ORDER BY updated DESC
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${JIRA_TOKEN}" && -n "${JIRA_USER_EMAIL}" ]] || { echo 'Configure JIRA_TOKEN and JIRA_USER_EMAIL Actions secrets.' >&2; exit 1; }
          fullsend poll \
            --input-driver jira-poll \
            --jira-url "${JIRA_BASE_URL}" \
            --jira-project RHAI \
            --jql "${JQL}" \
            --target-repo opendatahub-io/mlflow-go \
            --output dispatches.json \
            --fullsend-dir .fullsend

      # Retain every checkpointed record, including when a dispatch API call fails.
      - name: Save poll records
        uses: actions/upload-artifact@v4
        with:
          name: jira-dispatches-${{ github.run_attempt }}
          path: dispatches.json
          if-no-files-found: error
          retention-days: 7

      - name: Launch one workflow run per record
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .fullsend/scripts/jira_dispatch.py launch
