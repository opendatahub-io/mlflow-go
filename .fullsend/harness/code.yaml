# Jira-capable code pipeline; keep its pre/post scripts and provider boundary.
# TODO: replace v0.54.0 with its release commit SHA and set the sha256 digest
# once agents v0.54.0 is out.
base: https://raw.githubusercontent.com/fullsend-ai/agents/v0.54.0/harness/code.yaml#sha256=TODO

# No trigger here: the default code harness (agents v0.53 and later) dispatches
# on a ready-to-code label being added or a /fs-code comment, for GitHub and
# Jira. The poll's JQL limits Jira events to RHAI epics for this repository,
# and the dispatcher authorizes the actor (fullsend#8892 for Jira). This file
# stays so the Jira poller registers `code`.

env:
  runner:
    CODE_ALLOWED_TARGET_BRANCHES: "main"

overlays:
  - when: 'has(event.source) && event.source.system == "jira"'
    skills:
      - skills/rhai-epics
