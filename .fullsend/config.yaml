# Per-repository issue, review, and fix agents for opendatahub-io/mlflow-go.
version: "1"
runtime: pi
keep_history: false
roles:
  - triage
  - review
  - coder
agents:
  - name: code
    source: harness/code.yaml
    model: openai/gpt-6.1-sol
  - name: triage
    model: openai/gpt-6-luna
  - name: review
    model: openai/gpt-6.1-sol
    subagents:
      challenger: openai/gpt-6.1-sol
      correctness: openai/gpt-6.1-sol
      cross-repo-contracts: openai/gpt-6.1-sol
      docs-currency: openai/gpt-6-luna
      intent-coherence: openai/gpt-6.1-sol
      risk-assessment: openai/gpt-6-luna
      security: openai/gpt-6.1-sol
      security-triage: openai/gpt-6-luna
      style-conventions: openai/gpt-6-luna
  - name: fix
    model: openai/gpt-6.1-sol
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/fullsend/
  - https://raw.githubusercontent.com/fullsend-ai/agents/
# Jira authorization for the RHAI poller (needs fullsend#8892, v0.54.0 or
# later). Any user who can edit an RHAI epic may add ready-to-code. /fs-code
# comments are authorized for members of the listed group, checked through
# Jira's user-groups API. jira-software-users-redhat includes every Red Hat
# Jira user; a team that wants a narrower audience lists a smaller group.
authorization:
  - provider: jira
    write:
      groups: ["67a1a37e-d4d4-46d6-a681-294ce3241678"]  # jira-software-users-redhat
create_issues:
  allow_targets:
    repos:
      - opendatahub-io/mlflow-go
